services:
  - type: web
    name: loan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production

  - type: static_site
    name: loan-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
